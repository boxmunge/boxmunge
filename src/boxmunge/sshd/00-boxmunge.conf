# Managed by boxmunge: installed by install.sh (bootstrap/sshd-hardening.sh) on
# every install and upgrade, and compared with the release's copy by `health`.
# It sorts first in sshd_config.d, and sshd keeps the first value it reads, so
# these win over later drop-ins such as cloud-init's 50-cloud-init.conf.
PasswordAuthentication no
KbdInteractiveAuthentication no
PermitRootLogin no
X11Forwarding no
AllowTcpForwarding no
AllowStreamLocalForwarding no
AllowAgentForwarding no
PermitTunnel no
GatewayPorts no
PermitUserEnvironment no

# deploy's restricted shell is its boundary: no channel may bypass it, and no
# client variable may run code before it. A Match block in an included file
# ends with the file. AcceptEnv adds up across Match blocks, so install.sh
# refuses a box where a later one widens it.
Match User deploy
    AcceptEnv LANG LC_* COLORTERM NO_COLOR
    X11Forwarding no
    AllowTcpForwarding no
    AllowStreamLocalForwarding no
    AllowAgentForwarding no
    PermitTunnel no
    GatewayPorts no
    DisableForwarding yes
    PermitUserRC no
