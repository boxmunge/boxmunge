# system/compose.yml
# boxmunge-system container — managed by boxmunge platform
# Do not edit directly.
#
# The mounts below must match boxmunge.system_container.system_mounts():
# the platform refuses to run age or rclone in a container mounted otherwise.
# Missing host paths fail `docker compose up` instead of being created as
# empty root-owned directories.

services:
  system:
    build:
      context: .
      dockerfile: Dockerfile
    # Named so the data helper (boxmunge.data_helper) runs exactly this
    # locally built image; boxmunge.invalid never resolves to a registry.
    image: boxmunge.invalid/system/system
    container_name: boxmunge-system
    restart: unless-stopped
    # Must be the deploy user (owner of projects/): age reads its 0600 temp
    # files and the group-readable backup key. install.sh writes these to
    # .env beside this file from `id -u deploy` / `id -g deploy`; boxmunge
    # refuses to use a container running as any other uid.
    user: "${BOXMUNGE_UID:?set by install.sh in .env}:${BOXMUNGE_GID:?set by install.sh in .env}"
    # The host user namespace, with the deploy uid: under a remapped daemon a
    # remapped container could not read the root:deploy 0640 backup key or
    # write age temp files as deploy. It stays non-root, cap_drop ALL,
    # read-only and no-new-privileges, so it has exactly deploy's rights.
    # The only userns_mode in the release (tests/test_userns_static.py); the
    # data helper runs this image remapped, through docker run.
    userns_mode: host
    volumes:
      # Backup key (read-only)
      - type: bind
        source: ${BOXMUNGE_CONFIG:-/opt/boxmunge/config}/backup.key
        target: /config/backup.key
        read_only: true
        bind:
          create_host_path: false
      # Operator's rclone config directory (read-only); holds rclone.conf
      - type: bind
        source: ${BOXMUNGE_CONFIG:-/opt/boxmunge/config}/rclone
        target: /config/rclone
        read_only: true
        bind:
          create_host_path: false
      # Project tree (read-write for encrypt/decrypt temp files)
      - type: bind
        source: ${BOXMUNGE_PROJECTS:-/opt/boxmunge/projects}
        target: /projects
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
