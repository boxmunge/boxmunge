# Caddy reverse proxy — managed by boxmunge
# Do not edit directly. Changes are made via boxmunge commands.

services:
  caddy:
    image: caddy:2-alpine
    container_name: boxmunge-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./maintenance:/etc/caddy/maintenance:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - boxmunge-proxy
    # Site access logs go to stdout as JSON; the host's CrowdSec reads them
    # through the Docker API (bootstrap/crowdsec-acquis.sh), so no host file
    # this container could replace is ever opened by root. Pinned to a
    # driver the Docker API can read back, rotated.
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    read_only: true
    # Site configs of releases before Caddy logged to stdout write
    # /var/log/caddy/access.log; a rollback to one regenerates them. Container
    # memory only, never a host path, read by nothing: it keeps a rolled-back
    # Caddy starting. Remove once no rollback target predates the stdout log.
    tmpfs:
      - /var/log/caddy:size=64m,mode=0700
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    healthcheck:
      test: ["CMD", "caddy", "validate", "--config", "/etc/caddy/Caddyfile"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  caddy_data:
  caddy_config:

networks:
  boxmunge-proxy:
    external: true
