# boxmunge project manifest. Full reference: run 'agent-help' on the server
# (PROJECT_CONVENTIONS), e.g. ssh -p 922 deploy@<server> agent-help
schema_version: 3
# The project's identity on the server. Generated by 'boxmunge init'; keep it.
id: {ulid}
project: {project}
source: bundle
hosts:
  - {host}
services:
  web:
    port: 8080
    routes:
      - path: /
    health: /healthz
    smoke: boxmunge-scripts/smoke.sh
    limits:
      memory: 128m
      cpus: "0.5"
    # Containers run with a read-only root filesystem and a tmpfs at /tmp.
    # Declare any other paths your app writes to:
    # writable:
    #   ephemeral:              # tmpfs, emptied on restart
    #     - /var/cache/myapp
    #   persistent:             # named volumes, kept across deploys
    #     - name: appdata
    #       mount: /app/data
backup:
  type: none
