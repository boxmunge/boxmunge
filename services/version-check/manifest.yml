schema_version: 3
id: 01VERSIONCHECK000000000000
project: boxmunge-web
source: bundle
hosts:
  - boxmunge.dev
services:
  web:
    port: 8147
    routes:
      - path: /
    health: /healthz
    smoke: boxmunge-scripts/smoke.sh
    writable:
      persistent:
        - name: check-data
          mount: /data
backup:
  type: volume
  # boxmunge captures the dump command's stdout into the encrypted snapshot,
  # then on restore pipes it back into stdin. The container only has
  # check-data:/data mounted; there is no /backup mount. Never `cat` the
  # file: a worker's open write transaction would tear the copy. backup_db
  # copies through SQLite's backup API and checks a dump before restoring it.
  dump_command: "python backup_db.py dump /data/checks.db"
  restore_command: "python backup_db.py restore /data/checks.db"
  retention: 7
