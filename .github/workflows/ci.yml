name: CI

# Runs on every pull request and on every push to main. Branch protection
# requires these jobs before a PR can merge (see CONTRIBUTING.md).
#
# Security notes for maintainers reviewing changes to this file:
# - Trigger is `pull_request`, never `pull_request_target`: fork PRs run with a
#   read-only token and no secrets.
# - Every `uses:` is pinned to a commit SHA and every pip install is
#   hash-pinned; tests/test_release_pinning.py enforces both.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Install pinned tooling
        run: pip install --require-hashes -r requirements-dev.txt
      - name: Ruff
        run: ruff check src tests cli/src cli/tests

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Install pinned dependencies
        run: |
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-tui.txt
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Server unit tests (includes pinning, file-length, and DCO-script lints)
        run: python -m pytest tests/ --ignore=tests/integration --ignore=tests/vm -m 'not integration' -q

  cli:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Install pinned client and tooling
        run: |
          pip install --require-hashes -r cli/requirements.txt -r cli/requirements-publish.txt
          pip install -e ./cli --no-deps
      - name: Client tests
        run: cd cli && python -m pytest tests -q
      - name: Build the distribution and smoke-test the wheel
        run: |
          python -m build --no-isolation cli/ --outdir dist/
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --require-hashes -r cli/requirements.txt
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-smoke/bin/boxmunge --version

  version-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Install pinned service and test dependencies
        run: |
          pip install --require-hashes -r services/version-check/requirements.txt
          pip install --require-hashes -r requirements-dev.txt
      - name: Version-check service tests
        run: cd services/version-check && python -m pytest tests -q

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - name: Install pinned dependencies
        run: |
          # requirements-mcp.txt: every server install includes MCP, and
          # test_mcp_integration.py talks to mcp-serve through it.
          pip install --require-hashes -r requirements.txt -r requirements-mcp.txt
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Fetch the v0.10.1 tag
        # test_legacy_upgrade.py installs boxmunge 0.10.1 from `git archive
        # v0.10.1`; the checkout above is depth 1 with no tags.
        run: git fetch --no-tags --depth=1 origin refs/tags/v0.10.1:refs/tags/v0.10.1
      - name: Integration tests (real Docker)
        env:
          # Turn "prerequisite missing" into a failure instead of a silent skip.
          BOXMUNGE_REQUIRE_INTEGRATION: '1'
        # Selects every test marked `integration`, wherever it lives.
        run: python -m pytest tests/ --ignore=tests/vm -m "integration and not userns_dind" -q

  arm64:
    # boxmunge supports arm64 hosts. Builds the system image natively on
    # arm64 (age and rclone are pinned per architecture), also through its
    # compose file as install.sh does, runs its tools, decrypts a snapshot
    # made by age 1.2.1 with them, and installs and runs the pinned arm64
    # cosign through bootstrap/cosign.sh, the library install.sh sources.
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Build the system image
        run: docker build -t boxmunge-system:ci system/
      - name: Build it through system/compose.yml, as install.sh does
        run: BOXMUNGE_UID=1000 BOXMUNGE_GID=1000 docker compose -f system/compose.yml build
      - name: age and rclone run in it, as arm64 binaries
        run: |
          test "$(docker run --rm --entrypoint uname boxmunge-system:ci -m)" = aarch64
          docker run --rm --entrypoint age boxmunge-system:ci --version
          docker run --rm --entrypoint rclone boxmunge-system:ci version
      - name: Its age decrypts a snapshot made by age 1.2.1
        run: |
          docker run --rm -v "$PWD/tests/fixtures/age-v1.2.1:/f:ro" --entrypoint age \
            boxmunge-system:ci --decrypt -i /f/identity.txt -o - /f/snapshot.tar.gz.age \
            > snapshot.tar.gz
          sha256sum -c tests/fixtures/age-v1.2.1/snapshot.tar.gz.sha256
      - name: The pinned arm64 cosign downloads, matches its hash and runs
        run: |
          test "$(dpkg --print-architecture)" = arm64
          sudo bash -c 'set -euo pipefail; source bootstrap/cosign.sh; install_cosign "$(dpkg --print-architecture)"'
          cosign version

  userns-dind:
    # Tests that remap and restart the Docker daemon. They control dockerd
    # themselves inside a privileged dind container (no systemd there); see
    # tests/integration/userns/run-in-dind.sh. Docker 28 boxes are on the
    # graph driver; Docker 29 boxes may be on either store.
    # Pinned: on ubuntu-latest's Ubuntu 26.04 image, the privileged dind
    # container's root filesystem turns read-only partway through (EROFS on
    # /etc/docker/daemon.json) and every test after it fails. Boxes run
    # Debian 13; the runner's OS is only the host for the dind container.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
            prior_store: containerd
          - image: docker:29.9.0-dind@sha256:0b6d18a4a222e71c88be6034926b4f6cde2fc33c2218643d03ccfddc65995470
            prior_store: overlay2
          - image: docker:28.5.2-dind@sha256:2a232a42256f70d78e3cc5d2b5d6b3276710a0de0596c145f627ecfae90282ac
            prior_store: overlay2
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
      - name: Remapped-daemon tests (privileged dind)
        run: >-
          docker run --rm --privileged
          -e BOXMUNGE_DIND_PRIOR_STORE=${{ matrix.prior_store }}
          -v "$PWD:/src:ro" --entrypoint sh "${{ matrix.image }}"
          /src/tests/integration/userns/run-in-dind.sh

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          fetch-depth: 0
      - name: Every commit is signed off (git commit -s)
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: bash scripts/check-dco.sh "$BASE" "$HEAD"
