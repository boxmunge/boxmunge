name: Publish CLI

# The client (`boxmunge` on PyPI) versions independently of the server
# (`boxmunge-server`, distributed via GitHub releases — see the distribution
# note in docs/). Server releases are tagged `v*`; client releases are tagged
# `cli-v*` so the two triggers cannot collide.
on:
  push:
    tags:
      - 'cli-v*'

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # Required for PyPI Trusted Publishing (OIDC). No long-lived API token
      # exists anywhere — PyPI verifies this workflow's identity directly.
      id-token: write
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v6
        with:
          python-version: '3.13'

      - name: Verify tag matches the packaged version
        run: |
          # Fail loudly rather than publish a version nobody asked for: an
          # artifact whose version disagrees with its tag cannot be traced
          # back to a commit, and PyPI versions cannot be reused once taken.
          TAG_VERSION="${GITHUB_REF_NAME#cli-v}"
          PKG_VERSION=$(python -c "import tomllib; print(tomllib.load(open('cli/pyproject.toml','rb'))['project']['version'])")
          DUNDER_VERSION=$(python -c "import re; print(re.search(r'__version__ = \"([^\"]+)\"', open('cli/src/boxmunge_cli/__init__.py').read()).group(1))")
          echo "tag=$TAG_VERSION pyproject=$PKG_VERSION __version__=$DUNDER_VERSION"
          if [ "$TAG_VERSION" != "$PKG_VERSION" ] || [ "$TAG_VERSION" != "$DUNDER_VERSION" ]; then
            echo "::error::Version mismatch — tag cli-v$TAG_VERSION, pyproject $PKG_VERSION, __version__ $DUNDER_VERSION"
            exit 1
          fi

      - name: Install pinned client and publish tooling
        run: |
          # Hash-pinned: the build that PyPI receives must be reproducible
          # from checked-in pins, exactly like the server release workflow.
          pip install --require-hashes -r cli/requirements.txt -r cli/requirements-publish.txt
          pip install -e ./cli --no-deps

      - name: Run client tests
        run: cd cli && python -m pytest tests -q

      - name: Build distributions
        # --no-isolation: build with the hash-pinned setuptools above rather
        # than an unpinned setuptools fetched into an isolated build env.
        run: python -m build --no-isolation cli/ --outdir dist/

      - name: Smoke-test the built wheel
        run: |
          python -m venv /tmp/wheel-smoke
          /tmp/wheel-smoke/bin/pip install --require-hashes -r cli/requirements.txt
          /tmp/wheel-smoke/bin/pip install --no-deps dist/*.whl
          /tmp/wheel-smoke/bin/boxmunge --version

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
