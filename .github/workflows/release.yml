name: Release

# Two jobs with separate privileges:
#
# - build: read-only. Gates the tag on releases.json, runs the tests, builds
#   the installer and bundle, and generates the SBOM. This is the job that
#   installs and runs third-party packages, so it gets no write token and no
#   OIDC token.
# - publish: holds contents: write and id-token: write. Runs no third-party
#   Python: it signs SHA256SUMS with cosign (keyless), drafts the release,
#   verifies the draft's class markers, and publishes.
#
# Any failure fails the workflow. There is no unsigned fallback: the upgrade
# shim refuses an unsigned release, so publishing one would only put an
# uninstallable release in front of every box.
#
# Every `uses:` is pinned to a commit SHA and every pip install is
# hash-pinned; tests/test_release_pinning.py enforces both.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      release_class: ${{ steps.release_class.outputs.class }}
      breaking: ${{ steps.release_class.outputs.breaking }}
      title: ${{ steps.release_class.outputs.title }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Release class gate (releases.json)
        id: release_class
        # The tag must match pyproject.toml and be listed in
        # services/version-check/releases.json with a valid class and
        # `breaking` flag; a breaking release must be X.Y.0. The release
        # title and notes preamble (with the [security] or [breakfix] and
        # [breaking] markers that GitHub-fallback boxes read) are generated
        # from that entry, never typed by hand.
        run: >-
          python scripts/release-lint.py check
          --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
          --notes-out "$RUNNER_TEMP/release-preamble.md"

      - name: Install pinned dependencies
        run: |
          # Hash-pinned transitive deps. --require-hashes refuses any package
          # not exactly matching a checked-in hash, blocking resolution drift
          # and unauthorised transitive bumps.
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-tui.txt
          pip install --require-hashes -r requirements-dev.txt
          # requirements-mcp.txt is not needed here: the unit tests never
          # import the third-party `mcp` package (ci.yml's integration job
          # installs it to run mcp-serve end to end). The bundle ships it
          # and every on-box install uses it.
          # Install boxmunge itself in editable mode without re-resolving deps
          # (already installed above).
          pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/integration --ignore=tests/vm -m 'not integration' -v

      - name: Build installer
        run: make installer

      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh

      - name: Stage release files
        run: |
          mkdir -p release
          cp dist/boxmunge-install.sh dist/boxmunge-*.tar.gz dist/sbom.json release/
          cp "$RUNNER_TEMP/release-preamble.md" release/

      - name: Upload release files
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: release/
          if-no-files-found: error
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      # Checked out only for scripts/release-lint.py (stdlib only). Nothing
      # from PyPI is installed or run in this job.
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - name: Download release files
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist/

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3

      - name: Sign artifacts (cosign keyless)
        run: |
          # Compute checksums with bare filenames so consumers can verify
          # by running `sha256sum -c SHA256SUMS` from any directory.
          # SHA256SUMS is computed FIRST so the signature covers it.
          (cd dist && sha256sum boxmunge-install.sh boxmunge-*.tar.gz > SHA256SUMS)
          # Keyless sign SHA256SUMS — this is the signature the upgrade shim
          # verifies. Output BOTH .sig and .cert; keyless verify-blob needs
          # the certificate to chain to Fulcio + Rekor.
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.cert \
            dist/SHA256SUMS
          # Sign the install script too for parity (used by fresh installs).
          cosign sign-blob --yes \
            --output-signature dist/boxmunge-install.sig \
            --output-certificate dist/boxmunge-install.cert \
            dist/boxmunge-install.sh

      - name: Create draft GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            dist/boxmunge-install.sh
            dist/boxmunge-install.sig
            dist/boxmunge-install.cert
            dist/boxmunge-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.cert
            dist/sbom.json
          fail_on_unmatched_files: true
          name: ${{ needs.build.outputs.title }}
          body_path: dist/release-preamble.md
          generate_release_notes: true
          # Created as a draft: drafts are invisible to boxes, so nothing is
          # offered until the text has been verified below.
          draft: true

      - name: Verify the draft classifies as releases.json says
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CLASS: ${{ needs.build.outputs.release_class }}
          RELEASE_BREAKING: ${{ needs.build.outputs.breaking }}
        run: |
          # Generated notes quote PR titles; a PR titled "[security] ..."
          # would otherwise turn a feature release into an auto-applied one
          # for boxes that fall back to the GitHub API, and one titled
          # "[breaking] ..." would stop them crossing a non-breaking release.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json name,body > "$RUNNER_TEMP/release.json"
          python3 scripts/release-lint.py verify \
            --release-json "$RUNNER_TEMP/release.json" --class "$RELEASE_CLASS" \
            --breaking "$RELEASE_BREAKING"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
