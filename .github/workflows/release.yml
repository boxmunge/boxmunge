name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: '3.13'

      - name: Release class gate (releases.json)
        id: release_class
        # The tag must match pyproject.toml and be listed in
        # services/version-check/releases.json with a valid class. The
        # release title and notes preamble (with the [security] or
        # [breakfix] marker that GitHub-fallback boxes read) are generated
        # from that entry, never typed by hand.
        run: >-
          python scripts/release-lint.py check
          --tag "$GITHUB_REF_NAME"
          --github-output "$GITHUB_OUTPUT"
          --notes-out "$RUNNER_TEMP/release-preamble.md"

      - name: Install pinned dependencies
        run: |
          # Hash-pinned transitive deps. --require-hashes refuses any package
          # not exactly matching a checked-in hash, blocking resolution drift
          # and unauthorised transitive bumps.
          pip install --require-hashes -r requirements.txt
          pip install --require-hashes -r requirements-tui.txt
          pip install --require-hashes -r requirements-dev.txt
          # requirements-mcp.txt is intentionally not installed: the mcp
          # extra is for runtime users who run `boxmunge-server` as an MCP
          # server. CI does not import the third-party `mcp` package
          # (test_mcp_server.py only exercises in-tree boxmunge.mcp_tools).
          # If a future test does import mcp, add the install above.
          # Install boxmunge itself in editable mode without re-resolving deps
          # (already installed above).
          pip install -e . --no-deps

      - name: Run tests
        run: python -m pytest tests/ --ignore=tests/integration --ignore=tests/vm -m 'not integration' -v

      - name: Build installer
        run: make installer

      - name: Generate SBOM
        run: bash scripts/generate-sbom.sh

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3
        continue-on-error: true
        id: cosign

      - name: Sign artifacts (cosign keyless)
        if: steps.cosign.outcome == 'success'
        run: |
          # Compute checksums with bare filenames so consumers can verify
          # by running `sha256sum -c SHA256SUMS` from any directory.
          # SHA256SUMS is computed FIRST so the signature covers it.
          (cd dist && sha256sum boxmunge-install.sh boxmunge-*.tar.gz > SHA256SUMS)
          # Keyless sign SHA256SUMS — this is the signature the upgrade shim
          # verifies. Output BOTH .sig and .cert; keyless verify-blob needs
          # the certificate to chain to Fulcio + Rekor.
          cosign sign-blob --yes \
            --output-signature dist/SHA256SUMS.sig \
            --output-certificate dist/SHA256SUMS.cert \
            dist/SHA256SUMS
          # Sign the install script too for parity (used by fresh installs).
          cosign sign-blob --yes \
            --output-signature dist/boxmunge-install.sig \
            --output-certificate dist/boxmunge-install.cert \
            dist/boxmunge-install.sh

      - name: Generate checksums (unsigned — upgrade shim WILL refuse this release)
        if: steps.cosign.outcome != 'success'
        run: |
          # The cosign installer step failed. We still emit SHA256SUMS so a
          # human can audit the artifacts, but the upgrade shim hard-requires
          # a valid cosign signature on SHA256SUMS and will refuse to install
          # this release. To recover, re-run this workflow from a clean state.
          (cd dist && sha256sum boxmunge-install.sh boxmunge-*.tar.gz > SHA256SUMS)

      - name: Create GitHub Release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3
        with:
          files: |
            dist/boxmunge-install.sh
            dist/boxmunge-install.sig
            dist/boxmunge-install.cert
            dist/boxmunge-*.tar.gz
            dist/SHA256SUMS
            dist/SHA256SUMS.sig
            dist/SHA256SUMS.cert
            dist/sbom.json
          fail_on_unmatched_files: false
          name: ${{ steps.release_class.outputs.title }}
          body_path: ${{ runner.temp }}/release-preamble.md
          generate_release_notes: true
          # Created as a draft: drafts are invisible to boxes, so nothing is
          # offered until the text has been verified below.
          draft: true

      - name: Verify the draft classifies as releases.json says
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_CLASS: ${{ steps.release_class.outputs.class }}
        run: |
          # Generated notes quote PR titles; a PR titled "[security] ..."
          # would otherwise turn a feature release into an auto-applied one
          # for boxes that fall back to the GitHub API.
          gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" \
            --json name,body > "$RUNNER_TEMP/release.json"
          python scripts/release-lint.py verify \
            --release-json "$RUNNER_TEMP/release.json" --class "$RELEASE_CLASS"

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false
