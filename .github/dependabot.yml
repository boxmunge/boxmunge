# Dependabot config for boxmunge's reproducible-release pipeline.
#
# Ecosystems covered (each must stay covered — see tests/test_release_pinning.py):
#   - pip:           hash-pinned requirements files at repo root, cli/,
#                    services/version-check/ and tests/integration/userns/
#                    (the runtime locks built from pyproject extras are
#                    re-locked by hand: `make relock`, docs/DEVELOPMENT.md)
#   - github-actions: SHA-pinned actions in workflow files
#   - docker:        digest-pinned base images in every Dockerfile
#
# Dependabot is the routine path that updates these pins, except the runtime
# locks above. Other manual edits are allowed but should be rare and flagged
# in code review.
#
# To keep the noise down, each ecosystem is one entry: its minor and patch
# updates arrive as one grouped pull request a week, and each major as a pull
# request of its own. A release waits out a cooldown before it is proposed (a
# compromised upload is usually caught and yanked within days); majors wait
# longer where the ecosystem supports it (pip only: Dependabot ignores
# semver-*-days for github-actions and docker). Dependabot security updates
# are enabled for this repository, and they skip the cooldown.
#
# Not covered: the per-architecture age and rclone pins in system/Dockerfile
# and the cosign pins in bootstrap/cosign.sh are bumped by hand, from
# upstream's signed checksums (see the comments there).

version: 2
updates:
  # Python deps: the server package (/), the public version-check service,
  # the CLI package (which keeps its own Python floor), and the userns
  # integration tier's Docker-in-Docker test runner.
  - package-ecosystem: pip
    directories:
      - "/"
      - "/services/version-check"
      - "/cli"
      - "/tests/integration/userns"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      pip-minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  # GitHub Actions (SHA pins in workflow files, each with a `# vX.Y.Z` comment)
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Its v4 installs cosign v3, which signs to a new bundle format by
      # default. Releases are signed as .sig/.cert for the cosign v2 the boxes
      # verify with (bootstrap/cosign.sh), so that move is made by hand, with
      # the boxes' verifier in step.
      - dependency-name: sigstore/cosign-installer
        update-types: [version-update:semver-major]
    open-pull-requests-limit: 5

  # Container base images (digest pins in Dockerfiles)
  - package-ecosystem: docker
    directories:
      - "/system"
      - "/canary"
      - "/services/version-check"
      - "/sample-project/frontend"
      - "/sample-project/backend"
      - "/tests/integration/fixture_project"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      images-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Images run the Python the boxes run, Debian 13's 3.13; a newer
      # Python moves with the server's requires-python, by hand.
      - dependency-name: python
        versions: [">=3.14"]
    open-pull-requests-limit: 5
